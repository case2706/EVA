<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EVA Cyber Simulator</title>

    <link rel="icon" href="assets/logo/favicon.png">

    <link rel="stylesheet" href="css/style.css">

    </head>
<body>

    <!-- Загрузка -->
    <div id="loading-screen" class="screen active">

        <div class="loading-container">

    <div class="eva-logo">
        EVA
    </div>

    <div class="eva-subtitle">
        CYBER SECURITY SIMULATOR
    </div>

    <div class="eva-version">
        VERSION 1.0
    </div>

    <div class="loading-status" id="loading-status">
        INITIALIZING CORE...
    </div>

    <div class="loading-bar">

        <div id="progress-fill"></div>

    </div>

    <div id="loading-percent">

        0%

    </div>

</div>

    </div>


    <!-- Главное окно -->
    <div id="app" class="screen">

        <!-- Верхняя панель -->
        <header id="header">

            <div class="eva-title">
                EVA CORE
            </div>

            <div id="mission-title">
                Mission
            </div>

        </header>


        <!-- Контент -->
        <main id="content">

            <!-- Имя говорящего -->
            <div id="speaker">

            </div>

            <!-- Основной текст -->
            <div id="text">

            </div>

            <!-- Картинки -->
            <div id="image-container">

            </div>

            <!-- Дополнительный контент -->
            <div id="extra-content">

            </div>

        </main>


        <!-- Кнопки -->
        <footer id="buttons">

        </footer>

    </div>


    <!-- Затемнение -->
    <div id="overlay"></div>


    <!-- Модальное окно -->
    <div id="modal">

        <div id="modal-box">

            <div id="modal-title">

            </div>

            <div id="modal-text">

            </div>

            <div id="modal-buttons">

            </div>

        </div>

    </div>


    <!-- Уведомления -->
    <div id="notification">

        <div id="notification-icon">

        </div>

        <div id="notification-text">

        </div>

    </div>


    <!-- Звуки -->
    <audio id="sound-click" src="assets/sounds/click.mp3"></audio>

<audio id="sound-success" src="assets/sounds/success.mp3"></audio>

<audio id="sound-error" src="assets/sounds/error.mp3"></audio>

<audio id="sound-notification" src="assets/sounds/notification.mp3"></audio>

<audio id="sound-startup" src="assets/sounds/startup.mp3"></audio>

<audio id="sound-typing" src="assets/sounds/typing.mp3"></audio>

<audio id="sound-ambient"
       src="assets/sounds/ambient.mp3"
       loop></audio>


<script src="js/engine.js"></script>
<script src="js/ui.js"></script>

<script src="js/mission1.js"></script>
<script src="js/mission2.js"></script>
<script src="js/mission3.js"></script>
<script src="js/mission4.js"></script>
<script src="js/mission5.js"></script>
<script src="js/mission6.js"></script>
<script src="js/mission7.js"></script>
<script src="js/mission8.js"></script>
<script src="js/mission9.js"></script>
<script src="js/mission10.js"></script>
<script src="js/mission11.js"></script>
<script src="js/mission12.js"></script>
<script src="js/mission13.js"></script>
<script src="js/mission14.js"></script>
<script src="js/mission15.js"></script>
<script src="js/mission16.js"></script>

<script src="js/app.js"></script>

</body>
</html>
